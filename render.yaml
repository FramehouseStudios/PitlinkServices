# Render Blueprint — provisions the whole Pitlink stack in one step.
#
#   Render dashboard → New → Blueprint → connect this repo → Apply.
#
# It creates the web service, PostgreSQL, and Key Value (Redis), wires the
# connection strings, generates a strong JWT secret, and runs migrations
# before every deploy. Nothing here commits money on your behalf: Render
# shows the cost and asks you to confirm before creating anything.
services:
  - name: pitlink
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    # NOT free: the free tier sleeps, and a sleeping instance stops the
    # reliability sweep — no-show recovery would silently stop working.
    plan: 0.5c-512mb
    healthCheckPath: /health
    # Compiled JS, not `npm run migrate`: the runtime image omits
    # devDependencies, so tsx is unavailable there.
    preDeployCommand: node dist/scripts/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pitlink-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pitlink-keyvalue
          type: keyvalue
          property: connectionString
      # 256-bit random value generated by Render — satisfies the production
      # secret check, and no human ever sees or copies it.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1h
      # DECIDED in the canonical documents.
      - key: DEFAULT_CITY
        value: los-angeles
      - key: ENABLE_PROVIDER_MARKETPLACE
        value: "true"
      - key: ENABLE_PREDICTIVE_ALERTS
        value: "false"

  - name: pitlink-keyvalue
    type: keyvalue
    region: oregon
    plan: 256mb
    # Provider presence only; reachable from the app over the private network.
    ipAllowList: []

databases:
  - name: pitlink-postgres
    region: oregon
    # 0.5 CPU / 1GB: the evidence spine grows, and every paid plan includes
    # point-in-time recovery. Do not use `free` — no recovery at all.
    plan: 0.5c-1g
    postgresMajorVersion: "17"
