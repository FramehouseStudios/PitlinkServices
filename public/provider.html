<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitlink Provider</title>
<style>
  :root { --ink: #111; --muted: #737373; --line: #e5e5e5; --go: #0a7d33; --stop: #b3261e; --bg: #fff; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; justify-content: center; min-height: 100vh; padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .tag { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  section { display: none; }
  section.on { display: block; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 4px; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
  button {
    width: 100%; padding: 14px; margin-top: 20px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer;
  }
  button.quiet { background: transparent; color: var(--muted); font-weight: 400; padding: 10px; margin-top: 4px; }
  button.go { background: var(--go); }
  button.stop { background: var(--stop); }
  .err { color: var(--stop); font-size: 14px; margin-top: 12px; min-height: 20px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: middle; }
  .dot.live { background: var(--go); }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row b { font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 20px; }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 2px; text-transform: capitalize; }
  .card p { color: var(--muted); font-size: 14px; }
  .warn { border-left: 3px solid var(--stop); padding-left: 12px; margin-top: 16px; font-size: 14px; }
  .warn b { color: var(--stop); }
  .none { color: var(--muted); font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Pitlink Provider</h1>
  <p class="tag">Work the queue.</p>

  <section id="auth" class="on">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <button id="signupBtn" class="quiet">Create a provider account</button>
    <p class="err" id="authErr"></p>
  </section>

  <section id="work">
    <p><span class="dot" id="dot"></span><span id="onlineLabel">Offline</span></p>
    <label>Your location</label>
    <div style="display:flex;gap:8px">
      <input id="lat" type="number" step="any" placeholder="latitude">
      <input id="lng" type="number" step="any" placeholder="longitude">
    </div>
    <button id="locate" class="quiet">Use my location</button>
    <button id="toggle" class="go">Go online</button>

    <div id="job" class="card" style="display:none">
      <h2 id="jobType"></h2>
      <p id="jobWhere"></p>
      <button id="advance"></button>
    </div>
    <p class="none" id="noJob">No job assigned yet.</p>

    <h3 style="margin-top:32px;font-size:14px;color:var(--muted);font-weight:400">Your standing</h3>
    <div id="standing"></div>
    <div class="warn" id="suppressed" style="display:none"></div>

    <button id="logout" class="quiet" style="margin-top:24px">Sign out</button>
    <p class="err" id="workErr"></p>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const show = (id) => { for (const s of document.querySelectorAll("section")) s.classList.remove("on"); $(id).classList.add("on"); };
  let token = null, online = false, beat = null, poll = null, job = null;
  try { token = localStorage.getItem("pitlink_provider_token"); } catch {}

  const api = async (method, path, body, key) => {
    const res = await fetch(path, {
      method,
      headers: {
        "content-type": "application/json",
        ...(token ? { authorization: "Bearer " + token } : {}),
        ...(key ? { "idempotency-key": key } : {}),
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || ("error " + res.status));
    return json;
  };

  const auth = async (path) => {
    $("authErr").textContent = "";
    try {
      const r = await api("POST", path, { email: $("email").value, password: $("password").value });
      token = r.token;
      try { localStorage.setItem("pitlink_provider_token", token); } catch {}
      start();
    } catch (err) { $("authErr").textContent = err.message; }
  };
  $("signin").onclick = () => auth("/providers/login");
  $("signupBtn").onclick = () => auth("/providers/signup");
  $("logout").onclick = () => {
    goOffline(); token = null;
    try { localStorage.removeItem("pitlink_provider_token"); } catch {}
    clearInterval(poll); show("auth");
  };

  $("locate").onclick = () => navigator.geolocation?.getCurrentPosition(
    (pos) => { $("lat").value = pos.coords.latitude; $("lng").value = pos.coords.longitude; },
    () => { $("workErr").textContent = "Location unavailable — enter it manually."; }
  );

  const heartbeat = async () => {
    const lat = Number($("lat").value), lng = Number($("lng").value);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    // Availability follows the truth: busy on a job is still "present".
    await api("POST", "/providers/heartbeat", {
      lat, lng, available: !job,
      serviceTypes: ["jump_start","tire_change","lockout","fuel_delivery","ev_charge","tow","mobile_battery"],
    });
  };

  const goOnline = async () => {
    $("workErr").textContent = "";
    if ($("lat").value.trim() === "" || $("lng").value.trim() === "") {
      $("workErr").textContent = "Set your location before going online.";
      return;
    }
    try { await heartbeat(); } catch (err) { $("workErr").textContent = err.message; return; }
    online = true;
    beat = setInterval(() => heartbeat().catch(() => {}), 30000);
    render();
  };
  const goOffline = () => { online = false; clearInterval(beat); beat = null; render(); };
  $("toggle").onclick = () => (online ? goOffline() : goOnline());

  const NEXT = { matched: "en_route", en_route: "on_scene", on_scene: "resolved" };
  const CTA = { matched: "Start driving", en_route: "I've arrived", on_scene: "Mark resolved" };

  $("advance").onclick = async () => {
    if (!job) return;
    const next = NEXT[job.status];
    $("workErr").textContent = "";
    try {
      await api("POST", `/requests/${job.id}/${next}`, undefined, crypto.randomUUID());
      await refresh();
      // Push a position ping while en route so the member sees movement.
      if (next === "en_route") {
        await api("POST", `/requests/${job.id}/ping`, { lat: Number($("lat").value), lng: Number($("lng").value) }).catch(() => {});
      }
    } catch (err) { $("workErr").textContent = err.message; }
  };

  const render = () => {
    $("dot").className = "dot" + (online ? " live" : "");
    $("onlineLabel").textContent = online ? (job ? "Online · on a job" : "Online · waiting for work") : "Offline";
    $("toggle").textContent = online ? "Go offline" : "Go online";
    $("toggle").className = online ? "stop" : "go";
    if (job && NEXT[job.status]) {
      $("job").style.display = "";
      $("noJob").style.display = "none";
      $("jobType").textContent = job.serviceType.replaceAll("_", " ");
      $("jobWhere").textContent = `${job.city} · ${job.lat.toFixed(4)}, ${job.lng.toFixed(4)}`;
      $("advance").textContent = CTA[job.status];
    } else {
      $("job").style.display = "none";
      $("noJob").style.display = online ? "" : "none";
    }
  };

  const refresh = async () => {
    try {
      const [{ job: current }, { standing }] = await Promise.all([
        api("GET", "/providers/jobs/current"),
        api("GET", "/providers/me"),
      ]);
      job = current;
      if (standing) {
        $("standing").innerHTML = [
          ["Jobs accepted", standing.accepted],
          ["Completed", standing.completed],
          ["No-shows", standing.noShows],
          ["Rating", standing.avgRating === null ? "—" : standing.avgRating.toFixed(1) + " ★ (" + standing.ratingCount + ")"],
        ].map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join("");
        if (standing.suppressed) {
          $("suppressed").style.display = "";
          $("suppressed").innerHTML = "<b>You're being passed over for new jobs.</b><br>" +
            standing.suppressionReasons.join("<br>") +
            "<br>This lifts as your record improves.";
        } else {
          $("suppressed").style.display = "none";
        }
      }
      render();
    } catch (err) { $("workErr").textContent = err.message; }
  };

  const start = () => { show("work"); refresh(); poll = setInterval(refresh, 5000); };
  if (token) start();
})();
</script>
</body>
</html>
